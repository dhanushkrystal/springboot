<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
</head>
<body>
<h1>Employee Details</h1>
<p><strong>ID:</strong> <span th:text="${employee.empId}"></span></p>
<p><strong>Name:</strong> <span th:text="${employee.empName}"></span></p>
<p><strong>Email:</strong> <span th:text="${employee.empEmail}"></span></p>
<p><strong>Location:</strong> <span th:text="${employee.empLocation}"></span></p>
<br>
<a href="/submitemployee">Back to All Employees</a>
</body>
</html>
